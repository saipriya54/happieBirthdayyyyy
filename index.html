<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<title>happieBirthdayyyyy</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0c0a12;--bg-warm:#181420;
  --wall:#3a3048;--wall-hi:#524262;--wall-lo:#241e36;
  --floor:#3a3028;--floor-hi:#4a3e34;
  --cream:#f0e4d0;--cream-soft:#ddd0b8;
  --golden:#d4a63c;--golden-soft:#c49832;--golden-glow:rgba(212,166,60,.12);
  --amber:#c07828;--amber-soft:rgba(192,120,40,.15);
  --peach:#c49878;--peach-soft:#a88060;
  --sage:#7a9872;--sage-soft:rgba(122,152,114,.2);
  --rose:#a87888;--rose-soft:rgba(168,120,136,.1);
  --warm-brown:#6a5240;--warm-brown-soft:rgba(106,82,64,.25);
  --text:#e0d4c0;--text-dim:#8a7a68;--text-soft:#a89880;
  --lamp:rgba(255,210,120,.1);--lamp-core:rgba(255,195,90,.2);
  --shadow:rgba(8,6,14,.7)
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--cream);
  font-family:'Cormorant Garamond','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
  font-weight:300;letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  user-select:none;-webkit-user-select:none;touch-action:pan-y}

/* ===== TEXTURES & OVERLAYS ===== */
#grain{position:fixed;top:-50%;left:-50%;width:200%;height:200%;pointer-events:none;z-index:9998;opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
#paper-tex{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9997;opacity:.03;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(245,230,208,.03) 2px,rgba(245,230,208,.03) 4px),
  repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(245,230,208,.02) 3px,rgba(245,230,208,.02) 5px)}
#vignette{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9996;
  background:radial-gradient(ellipse 70% 70% at center,transparent 40%,rgba(6,4,10,.6) 100%)}

/* ===== CANVASES ===== */
#starCanvas,#particleCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none}
#starCanvas{z-index:1}
#particleCanvas{z-index:50}

/* ===== LAYOUT ===== */
#app{width:100%;height:100%;position:relative;overflow:hidden;z-index:2}
.scene{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;opacity:0;pointer-events:none;
  transition:opacity 1.8s cubic-bezier(.4,0,.2,1);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scene.active{opacity:1;pointer-events:auto}
.scene-scroll{width:100%;min-height:100%;display:flex;flex-direction:column;align-items:center;
  padding:60px 24px 80px;gap:28px}

/* ===== TYPOGRAPHY ===== */
.chapter-title{font-size:clamp(.58rem,1.6vw,.68rem);color:var(--text-dim);letter-spacing:.4em;
  text-align:center;line-height:1.4;text-transform:uppercase;font-weight:400}
.chapter-sub{font-size:clamp(1.05rem,3.8vw,1.5rem);color:var(--cream);letter-spacing:.06em;text-align:center;margin-top:-4px;font-weight:300}
.narration{font-size:clamp(1rem,3vw,1.15rem);color:var(--text);text-align:center;line-height:2;
  max-width:320px;margin:0 auto;opacity:0;transform:translateY(16px);font-weight:300;
  transition:opacity 1.6s cubic-bezier(.25,.1,.25,1),transform 1.6s cubic-bezier(.25,.1,.25,1)}
.narration.visible{opacity:1;transform:translateY(0)}
.narration em{color:var(--golden);font-style:italic;font-weight:400}

/* ===== BUTTONS ===== */
.story-btn{font-family:inherit;font-size:clamp(.7rem,2vw,.8rem);font-weight:300;color:var(--golden);
  background:transparent;border:1px solid rgba(212,166,60,.18);padding:15px 36px;
  border-radius:100px;cursor:pointer;letter-spacing:.22em;text-transform:uppercase;
  transition:all .6s ease;min-height:50px;-webkit-tap-highlight-color:transparent}
.story-btn:active{background:rgba(212,166,60,.04);border-color:rgba(212,166,60,.35)}
.story-btn.secondary{color:var(--text-soft);
  background:transparent;border-color:rgba(255,255,255,.06)}

/* ===== WELCOME ===== */
.earth-container{width:clamp(130px,38vw,200px);height:clamp(130px,38vw,200px);position:relative;
  opacity:0;transform:scale(.6);transition:opacity 2.5s ease,transform 2.5s cubic-bezier(.4,0,.2,1)}
.earth-container.visible{opacity:1;transform:scale(1)}
.earth-glow{position:absolute;top:-30%;left:-30%;width:160%;height:160%;border-radius:50%;
  background:radial-gradient(circle,rgba(100,160,240,.06) 0%,rgba(60,120,200,.03) 30%,transparent 60%);
  animation:pulse-glow 8s ease-in-out infinite}
@keyframes pulse-glow{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.welcome-title{font-size:clamp(.65rem,1.8vw,.75rem);color:var(--text-dim);letter-spacing:.3em;
  text-align:center;line-height:2.2;opacity:0;transition:opacity 3s ease;font-weight:300}
.welcome-title.visible{opacity:1}
.welcome-title em{color:var(--golden);font-style:normal;font-weight:300;font-size:clamp(1.4rem,5vw,2rem);display:block;margin-top:8px;letter-spacing:.12em}

/* (bedroom CSS removed — replaced by constellation) */

/* ===== POPUP ===== */
.popup-overlay{position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(8,6,14,.96);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;z-index:100;
  opacity:0;pointer-events:none;transition:opacity .7s ease;padding:24px}
.popup-overlay.active{opacity:1;pointer-events:auto}
.popup-content{max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.popup-content .narration{opacity:1;transform:none}
.popup-close{font-family:inherit;font-size:.6rem;font-weight:300;color:var(--text-dim);background:none;
  border:none;cursor:pointer;padding:16px;letter-spacing:.3em;-webkit-tap-highlight-color:transparent;
  transition:color .3s ease}

/* ===== TRAITS ===== */
.traits-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;max-width:380px}
.trait-orb{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;transition:all .5s ease;-webkit-tap-highlight-color:transparent}
.trait-orb .orb-bg{position:absolute;width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(212,166,60,.06),rgba(20,18,40,.4));
  border:1px solid rgba(212,166,60,.08);transition:all .5s ease;
  box-shadow:0 4px 24px rgba(0,0,0,.25)}
.trait-orb:active .orb-bg{border-color:rgba(212,166,60,.25);
  box-shadow:0 0 30px rgba(212,166,60,.08)}
.trait-orb .orb-label{position:relative;z-index:1;font-size:.52rem;letter-spacing:.25em;color:var(--golden);text-align:center;font-weight:300;text-transform:uppercase}

/* ===== PLANETS ===== */
.planets-container{position:relative;width:100%;max-width:380px;min-height:500px}
.planet{position:absolute;cursor:pointer;transition:all .5s ease;-webkit-tap-highlight-color:transparent}
.planet-body{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:8px;font-size:.46rem;line-height:1.4;color:var(--cream-soft);letter-spacing:.02em;
  position:relative;font-weight:300;
  box-shadow:0 4px 20px rgba(0,0,0,.35),inset 0 -2px 8px rgba(0,0,0,.2)}

/* ===== DAY IN LIFE ===== */
.time-stamp{font-size:clamp(.6rem,1.6vw,.7rem);color:var(--text-dim);letter-spacing:.35em;text-align:center;font-weight:300}
.choice-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.food-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:300px;width:100%}
.food-choice{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:14px;
  background:rgba(212,166,60,.02);border:1px solid rgba(212,166,60,.06);
  cursor:pointer;transition:all .4s ease;-webkit-tap-highlight-color:transparent;font-weight:300}
.food-choice:active{background:rgba(212,166,60,.08);border-color:rgba(212,166,60,.2)}
.food-emoji{font-size:1.8rem}
.food-label{font-size:.52rem;color:var(--cream-soft);letter-spacing:.18em}

/* ===== EFFECTS ===== */
.happiness-float{position:fixed;pointer-events:none;z-index:200;font-size:.85rem;color:var(--golden);
  font-weight:300;letter-spacing:.05em;
  text-shadow:0 0 12px rgba(212,166,60,.25);animation:float-up 2s ease forwards}
@keyframes float-up{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(1.1)}}

/* ===== MINI GAME ===== */
.mini-game-area{width:100%;max-width:320px;aspect-ratio:3/4;
  background:linear-gradient(180deg,rgba(14,12,24,.8),rgba(26,24,50,.5));
  border-radius:16px;border:1px solid rgba(212,166,60,.05);position:relative;overflow:hidden;touch-action:none;
  box-shadow:inset 0 0 50px rgba(0,0,0,.4)}
.game-target{position:absolute;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,230,170,.9),var(--golden));
  box-shadow:0 0 16px rgba(212,166,60,.3),0 0 40px rgba(212,166,60,.08);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;
  -webkit-tap-highlight-color:transparent;transition:transform .12s ease}
.game-target:active{transform:scale(.85)}
.game-score{position:absolute;top:14px;right:14px;font-size:.62rem;color:var(--golden);letter-spacing:.18em;font-weight:300}
.game-timer{position:absolute;top:14px;left:14px;font-size:.62rem;color:var(--text-dim);letter-spacing:.18em;font-weight:300}

/* ===== 25 ===== */
.big-25{font-size:clamp(5rem,22vw,9rem);color:var(--golden);text-align:center;line-height:1;opacity:.08;
  transition:opacity 3s ease;font-weight:200;letter-spacing:-.02em}
.stars-25-grid{position:relative;width:240px;height:200px;margin:0 auto}
.star-25{position:absolute;width:22px;height:22px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .8s ease,transform .8s ease}
.star-25 svg{width:100%;height:100%;fill:rgba(212,166,60,.15);transition:all .8s ease}
.star-25.lit svg{fill:rgba(212,166,60,.5)}
.star-25.bright svg{fill:var(--golden);filter:drop-shadow(0 0 12px var(--golden)) drop-shadow(0 0 24px rgba(212,166,60,.25))}
.star-25.fading{opacity:0!important;transform:scale(.3)!important;transition:opacity 1.2s ease,transform 1.2s ease}

/* ===== FIREWORKS ===== */
.firework-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}

/* ===== HAPPY BIRTHDAY SPECIAL ===== */
.hb-special{font-family:'Great Vibes','Brush Script MT',cursive;font-size:clamp(2.8rem,9vw,4.5rem);color:#fff;text-align:center;
  font-weight:400;letter-spacing:.02em;line-height:1.4;opacity:0;transition:opacity 3s ease;position:relative;z-index:10;
  text-shadow:0 0 7px #fff,0 0 20px rgba(255,255,255,.7),0 0 40px rgba(255,240,220,.5),0 0 80px rgba(255,230,200,.3),0 0 120px rgba(255,220,180,.15);margin:32px 0 16px}
.hb-special em{font-style:normal;font-weight:400;display:block;font-size:clamp(3.2rem,11vw,5.5rem);
  margin-top:8px;letter-spacing:.02em;color:#fff;
  text-shadow:0 0 7px #fff,0 0 20px rgba(255,255,255,.7),0 0 40px rgba(255,240,220,.5),0 0 80px rgba(255,230,200,.3),0 0 120px rgba(255,220,180,.15);
  animation:hb-glow 3s ease-in-out infinite alternate}
@keyframes hb-glow{0%{text-shadow:0 0 7px #fff,0 0 20px rgba(255,255,255,.6),0 0 40px rgba(255,240,220,.4),0 0 80px rgba(255,230,200,.2)}100%{text-shadow:0 0 10px #fff,0 0 25px rgba(255,255,255,.8),0 0 50px rgba(255,240,220,.6),0 0 100px rgba(255,230,200,.35),0 0 150px rgba(255,220,180,.2)}}

/* ===== PHONE / CHINNODU ===== */
.phone-body{width:clamp(140px,40vw,180px);aspect-ratio:9/19;
  background:linear-gradient(165deg,#1a1828,#141220);
  border-radius:24px;border:1.5px solid rgba(255,255,255,.04);position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:20px 14px;margin:0 auto;
  box-shadow:0 10px 50px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.02)}
.phone-notch{width:28%;height:16px;background:var(--bg);border-radius:0 0 8px 8px;position:absolute;top:0}
.phone-notification{width:80%;background:rgba(212,166,60,.04);
  border:1px solid rgba(212,166,60,.08);border-radius:12px;padding:14px;
  opacity:0;transform:translateY(6px);transition:all 1s cubic-bezier(.25,.1,.25,1);text-align:left}
.phone-notification.visible{opacity:1;transform:translateY(0)}
.notif-contact{font-size:.6rem;color:var(--golden);letter-spacing:.18em;margin-bottom:4px;font-weight:300}
.notif-message{font-size:.55rem;color:var(--cream-soft);line-height:1.5;font-weight:300;white-space:nowrap}
@keyframes phone-vibrate{0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-2px)}20%,40%,60%,80%{transform:translateX(2px)}}
.phone-vibrating{animation:phone-vibrate .4s ease 3}
.chat-bubble{background:rgba(212,166,60,.04);
  border:1px solid rgba(212,166,60,.1);border-radius:16px 16px 4px 16px;
  padding:16px 20px;max-width:260px;font-size:clamp(.82rem,2.5vw,.92rem);
  color:var(--cream);line-height:1.8;text-align:left;font-weight:300}

/* ===== ACHIEVEMENTS ===== */
.achievement{background:rgba(212,166,60,.03);
  border:1px solid rgba(212,166,60,.1);border-radius:16px;padding:28px;text-align:center;
  max-width:280px;display:flex;flex-direction:column;align-items:center;gap:10px}
.achievement-title{font-size:.52rem;color:var(--text-dim);letter-spacing:.35em;font-weight:300}
.achievement-text{font-size:.9rem;color:var(--golden);letter-spacing:.08em;font-weight:300}
.achievement-sub{font-size:.62rem;color:var(--text-dim);font-style:italic;font-weight:300}

/* ===== MIRROR ===== */
.mirror-frame{width:clamp(120px,35vw,160px);aspect-ratio:3/4;border-radius:50% 50% 45% 45%;
  border:1.5px solid rgba(212,166,60,.15);
  background:linear-gradient(150deg,rgba(30,26,40,.4),rgba(14,12,24,.7));
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;
  transition:all .6s ease;-webkit-tap-highlight-color:transparent;
  box-shadow:0 8px 30px rgba(0,0,0,.35)}
.mirror-frame:active{border-color:rgba(212,166,60,.3)}
.mirror-text{font-size:clamp(.62rem,1.8vw,.75rem);color:var(--golden);text-align:center;
  letter-spacing:.08em;padding:16px;opacity:0;transition:opacity 1.2s ease;font-weight:300}
.mirror-text.visible{opacity:1}
.mirror-reflection{position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.025) 50%,transparent 60%);
  animation:mirror-shine 6s ease-in-out infinite;pointer-events:none}
@keyframes mirror-shine{0%,100%{transform:translateX(-30%) translateY(-30%)}50%{transform:translateX(30%) translateY(30%)}}

/* ===== PROGRESS DOTS ===== */
.progress-dots{position:fixed;right:10px;top:50%;transform:translateY(-50%);display:flex;
  flex-direction:column;gap:7px;z-index:90;opacity:0;transition:opacity .6s ease}
.progress-dots.visible{opacity:1}
.progress-dot{width:4px;height:4px;border-radius:50%;background:rgba(212,166,60,.1);
  cursor:pointer;transition:all .4s ease;-webkit-tap-highlight-color:transparent}
.progress-dot.active{background:var(--golden);box-shadow:0 0 8px rgba(212,166,60,.25)}

/* ===== FINALE ===== */
.final-star{width:5px;height:5px;background:var(--golden);border-radius:50%;
  box-shadow:0 0 10px var(--golden),0 0 30px rgba(212,166,60,.2);
  animation:pulse-glow 6s ease-in-out infinite;margin:40px auto}
.wish-item{opacity:0;transform:translateY(15px);transition:opacity .9s ease,transform .9s ease}
.wish-item.visible{opacity:1;transform:translateY(0)}

/* ===== PLANET FLOATS ===== */
@keyframes planetFloat0{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes planetFloat1{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes planetFloat2{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ===== RESPONSIVE ===== */
@media(min-width:768px){
  .narration{max-width:440px}
  .bedroom{max-width:440px}
  .popup-content{max-width:420px}
  .traits-grid{max-width:480px}
  .trait-orb{width:108px;height:108px}
  .trait-orb .orb-label{font-size:.6rem}
  .planets-container{max-width:480px;min-height:600px}
  .planet-body{width:80px;height:80px;font-size:.52rem}
}
@media(min-width:1024px){
  .narration{max-width:500px;font-size:1.18rem}
  .scene-scroll{padding:80px 48px 100px}
}
/* ===== CONSTELLATION ===== */
#constellation-stage{position:relative;width:clamp(280px,75vw,360px);height:clamp(280px,75vw,360px);margin:0 auto;
  overflow:visible}
/* Moon */
.c-moon{position:absolute;top:4%;right:6%;width:48px;height:48px;border-radius:50%;
  background:radial-gradient(circle at 38% 35%,rgba(255,252,235,.12) 0%,rgba(220,210,180,.06) 50%,transparent 70%);
  box-shadow:0 0 40px 12px rgba(255,245,200,.04),0 0 80px 24px rgba(255,240,180,.02);
  pointer-events:none;animation:moon-glow 8s ease-in-out infinite}
.c-moon::before{content:'';position:absolute;top:8%;left:15%;width:75%;height:75%;border-radius:50%;
  background:radial-gradient(circle at 60% 40%,transparent 45%,rgba(180,170,140,.05) 100%)}
@keyframes moon-glow{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
/* Clouds */
.c-cloud{position:absolute;pointer-events:none;border-radius:50%;opacity:0;
  background:radial-gradient(ellipse,rgba(180,180,200,.04) 0%,rgba(140,140,170,.02) 40%,transparent 70%);
  animation:cloud-drift linear infinite}
.c-cloud:nth-child(1){width:180px;height:40px;top:12%;left:-10%;animation-duration:45s;opacity:.5}
.c-cloud:nth-child(2){width:140px;height:30px;top:35%;right:-8%;animation-duration:55s;animation-delay:-20s;opacity:.4}
.c-cloud:nth-child(3){width:200px;height:35px;bottom:18%;left:5%;animation-duration:60s;animation-delay:-10s;opacity:.35}
@keyframes cloud-drift{0%{transform:translateX(-20px);opacity:0}10%{opacity:var(--cloud-o,.4)}
  90%{opacity:var(--cloud-o,.4)}100%{transform:translateX(calc(100% + 60px));opacity:0}}
/* Stars — sparkling with cross rays */
.cstar{position:absolute;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .8s cubic-bezier(.25,.1,.25,1)}
.cstar-dot{width:14px;height:14px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center}
/* Core glow */
.cstar-dot::before{content:'';position:absolute;width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle,rgba(212,166,60,.5) 0%,rgba(212,166,60,.15) 40%,transparent 70%);
  transition:all .6s ease}
/* Cross-shaped rays */
.cstar-dot::after{content:'';position:absolute;width:200%;height:200%;
  background:
    linear-gradient(0deg,transparent 42%,rgba(255,240,180,.12) 48%,rgba(255,240,180,.2) 50%,rgba(255,240,180,.12) 52%,transparent 58%),
    linear-gradient(90deg,transparent 42%,rgba(255,240,180,.12) 48%,rgba(255,240,180,.2) 50%,rgba(255,240,180,.12) 52%,transparent 58%);
  opacity:0;transition:opacity 1s ease;pointer-events:none}
.cstar.waiting .cstar-dot::before{animation:cstar-pulse 3s ease-in-out infinite}
.cstar.waiting .cstar-dot::after{opacity:.3;animation:cstar-ray-pulse 3s ease-in-out infinite}
/* Revealed state — bright sparkle */
.cstar.revealed .cstar-dot{width:10px;height:10px}
.cstar.revealed .cstar-dot::before{
  background:radial-gradient(circle,rgba(255,248,220,1) 0%,rgba(212,166,60,.6) 30%,rgba(212,166,60,.2) 60%,transparent 80%);
  box-shadow:0 0 8px 2px rgba(255,240,180,.4),0 0 20px 4px rgba(212,166,60,.15)}
.cstar.revealed .cstar-dot::after{opacity:.7;animation:cstar-twinkle 4s ease-in-out infinite}
.cstar.done{pointer-events:none;opacity:.5}
@keyframes cstar-pulse{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.8);opacity:.9}}
@keyframes cstar-ray-pulse{0%,100%{opacity:.15;transform:scale(.8) rotate(0deg)}50%{opacity:.4;transform:scale(1.2) rotate(15deg)}}

  50%{opacity:.6;transform:scale(1) rotate(-5deg)}75%{opacity:1;transform:scale(1.15) rotate(3deg)}}
/* Connecting lines */

/* ===== BIRTHDAY CANDLE ===== */
.candle-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin:30px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}

.candle-flame{position:absolute;top:-48px;left:50%;transform:translateX(-50%);width:18px;height:36px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 60%,#fff 0%,#ffe080 25%,#ff9020 50%,#ff5500 70%,transparent 100%);animation:flame-dance 0.4s ease-in-out infinite alternate;filter:blur(0.5px)}
.candle-flame::after{content:'';position:absolute;top:4px;left:50%;transform:translateX(-50%);width:8px;height:16px;border-radius:50%;background:radial-gradient(ellipse,#fff 0%,#ffe8a0 40%,transparent 70%)}
.candle-glow{position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,180,60,.2) 0%,rgba(255,140,40,.08) 40%,transparent 70%);animation:flame-glow 1.5s ease-in-out infinite alternate;pointer-events:none}
@keyframes flame-dance{0%{transform:translateX(-50%) scaleX(1) scaleY(1) rotate(-2deg)}100%{transform:translateX(-50%) scaleX(.85) scaleY(1.08) rotate(2deg)}}
@keyframes flame-glow{0%{opacity:.7;transform:translateX(-50%) scale(1)}100%{opacity:1;transform:translateX(-50%) scale(1.1)}}
.candle-blown .candle-flame,.candle-blown .candle-glow{animation:none;opacity:0;transition:opacity .5s ease}
.candle-smoke{position:absolute;top:-50px;left:50%;width:4px;height:30px;opacity:0}
.candle-blown .candle-smoke{opacity:1;animation:smoke-rise 2s ease-out forwards}
@keyframes smoke-rise{0%{opacity:.5;transform:translateX(-50%) translateY(0) scaleY(1)}100%{opacity:0;transform:translateX(-50%) translateY(-50px) scaleY(2) scaleX(3)}}
.candle-smoke::after{content:'';position:absolute;width:100%;height:100%;background:rgba(200,200,200,.3);border-radius:50%;filter:blur(3px)}
.candle-hint{font-size:clamp(.65rem,1.8vw,.75rem);color:var(--text-dim);letter-spacing:.15em;opacity:0;transition:opacity 1.5s ease;font-style:italic}

/* ===== BUTTERFLY ===== */
.butterfly-wrap{position:relative;width:100%;height:140px;margin:24px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}

.bf-l,.bf-r{transform-origin:center;animation:bf-flap 1.2s ease-in-out infinite alternate}

@keyframes bf-flap{0%{transform:scaleX(1)}50%{transform:scaleX(0.55)}100%{transform:scaleX(1)}}

.wand{width:10px;height:110px;background:linear-gradient(180deg,#3a2a1a,#5a4430,#3a2a1a);border-radius:3px;position:relative;transform:rotate(-25deg);transition:transform .5s ease;box-shadow:inset 1px 0 2px rgba(255,255,255,.08)}

@keyframes wand-orbit2{0%{top:28px;left:-2px}25%{top:-2px;left:10px}50%{top:-2px;left:26px}75%{top:28px;left:26px}100%{top:28px;left:-2px}}
@keyframes wand-orbit3{0%{top:14px;left:30px}25%{top:30px;left:18px}50%{top:14px;left:-4px}75%{top:-2px;left:18px}100%{top:14px;left:30px}}

.wand-hint{font-size:clamp(.65rem,1.8vw,.75rem);color:var(--text-dim);letter-spacing:.15em;opacity:0;transition:opacity 1.5s ease;font-style:italic}
.wand-hint.visible{opacity:1}
.magic-flash{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9998;pointer-events:none;background:radial-gradient(circle at var(--mx) var(--my),rgba(212,166,60,.4) 0%,rgba(212,166,60,.1) 30%,transparent 60%);opacity:0;animation:magic-spread 2s ease-out forwards}
@keyframes magic-spread{0%{opacity:0;transform:scale(0)}20%{opacity:1;transform:scale(.5)}60%{opacity:.8;transform:scale(1.5)}100%{opacity:0;transform:scale(2)}}

/* ===== GIFT BOX ===== */
.gift-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin:40px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.gift-box{width:70px;height:60px;position:relative}

.gift-bow{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:36px;height:20px;z-index:2}
.gift-bow::before,.gift-bow::after{content:'';position:absolute;top:2px;width:18px;height:14px;background:linear-gradient(135deg,#e8c86a,#d4a63c);border-radius:50%;box-shadow:0 0 8px rgba(212,166,60,.3)}
.gift-bow::before{left:0;transform:rotate(-15deg)}
.gift-bow::after{right:0;transform:rotate(15deg)}
.gift-bow-knot{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:10px;height:10px;background:#c89430;border-radius:50%;z-index:3;box-shadow:0 0 6px rgba(212,166,60,.4)}
.gift-shine{position:absolute;top:8px;left:10px;width:8px;height:8px;background:rgba(255,255,255,.2);border-radius:50%;animation:gift-twinkle 2s ease-in-out infinite}
@keyframes gift-twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:.5;transform:scale(1.2)}}

.rocket-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin:40px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}

.fw-rocket-fin-r{right:-4px;transform:rotate(-8deg)}

.fw-rocket-fuse::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:radial-gradient(circle,#ffe080,#ff9040,transparent);animation:fuse-glow .5s ease-in-out infinite alternate;box-shadow:0 0 10px rgba(255,160,60,.6)}
@keyframes fuse-glow{0%{transform:translateX(-50%) scale(.7);opacity:.5}100%{transform:translateX(-50%) scale(1.2);opacity:1}}
.fw-rocket-sparks{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);width:6px;height:22px;background:linear-gradient(180deg,#ffe080,#ff9040,transparent);border-radius:50%;filter:blur(1.5px);animation:fuse-glow .3s ease-in-out infinite alternate}
.rocket-hint{font-size:clamp(.65rem,1.8vw,.75rem);color:var(--text-dim);letter-spacing:.15em;opacity:0;transition:opacity 1.5s ease;font-style:italic}

@keyframes rocket-launch{0%{transform:translateY(0)}100%{transform:translateY(-200vh);opacity:0}}
@keyframes tail-flicker{0%{opacity:.5;height:10px}100%{opacity:1;height:16px}}

/* ===== CLOUD INTERACTIVE ===== */
.cloud-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:80;pointer-events:auto}

.i-cloud svg{width:100%;height:100%}

.cloud-hint{position:fixed;bottom:15%;left:50%;transform:translateX(-50%);font-size:clamp(.65rem,1.8vw,.75rem);color:var(--text-dim);letter-spacing:.15em;opacity:0;transition:opacity 1.5s ease;font-style:italic;z-index:81;text-align:center}

<script>
// ============================================================
// THE LITTLE UNIVERSE OF GANI — Puuung Edition
// ============================================================
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// ===== MULTI-DEPTH STARFIELD =====
let starCanvas,sCtx;
let starLayers=[[],[],[]],nebulae=[],starOpacity=0,starTarget=1;
const dpr=()=>Math.min(devicePixelRatio||1,2);
function resizeSC(){const d=dpr();starCanvas.width=innerWidth*d;starCanvas.height=innerHeight*d;starCanvas.style.width=innerWidth+'px';starCanvas.style.height=innerHeight+'px';sCtx.setTransform(d,0,0,d,0,0)}
function createStars(){
  starLayers=[[],[],[]];nebulae=[];const w=innerWidth,h=innerHeight;
  // Layer 0: tiny distant pinpoints
  for(let i=0;i<160;i++)starLayers[0].push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*.6+.2,a:Math.random()*.25+.04,sp:Math.random()*.008+.002,ph:Math.random()*6.28,type:'dot'});
  // Layer 1: medium soft glowing dots + occasional crosses
  for(let i=0;i<40;i++)starLayers[1].push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.2+.5,a:Math.random()*.35+.08,sp:Math.random()*.012+.003,ph:Math.random()*6.28,type:Math.random()>.85?'cross':'soft'});
  // Layer 2: few larger painted stars with warm/cool tint
  for(let i=0;i<8;i++)starLayers[2].push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.8+1,a:Math.random()*.2+.1,sp:Math.random()*.006+.002,ph:Math.random()*6.28,type:'glow',hue:Math.random()>.5?'255,248,230':'212,200,240'});
  // Nebula patches — painted atmospheric haze
  for(let i=0;i<3;i++)nebulae.push({x:Math.random()*w,y:Math.random()*h,rx:Math.random()*200+100,ry:Math.random()*120+60,a:Math.random()*.015+.005,hue:['60,80,140','80,50,100','40,60,110'][i]});
}
function drawStars(t){
  sCtx.clearRect(0,0,innerWidth,innerHeight);starOpacity+=(starTarget-starOpacity)*.012;
  // Nebulae
  nebulae.forEach(n=>{const g=sCtx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.rx);g.addColorStop(0,`rgba(${n.hue},${n.a*starOpacity})`);g.addColorStop(.6,`rgba(${n.hue},${n.a*starOpacity*.3})`);g.addColorStop(1,'transparent');sCtx.beginPath();sCtx.ellipse(n.x,n.y,n.rx,n.ry,0,0,6.28);sCtx.fillStyle=g;sCtx.fill()});
  // Stars
  starLayers.forEach(layer=>layer.forEach(s=>{
    const tw=Math.sin(t*s.sp+s.ph)*.35+.65,a=s.a*tw*starOpacity;if(a<.005)return;
    if(s.type==='dot'){sCtx.fillStyle=`rgba(240,235,220,${a})`;sCtx.fillRect(s.x,s.y,s.r,s.r)}
    else if(s.type==='soft'){const g=sCtx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*2);g.addColorStop(0,`rgba(250,245,230,${a})`);g.addColorStop(1,'transparent');sCtx.beginPath();sCtx.arc(s.x,s.y,s.r*2,0,6.28);sCtx.fillStyle=g;sCtx.fill()}
    else if(s.type==='cross'){sCtx.strokeStyle=`rgba(240,235,220,${a*.6})`;sCtx.lineWidth=.5;sCtx.beginPath();sCtx.moveTo(s.x-s.r*2,s.y);sCtx.lineTo(s.x+s.r*2,s.y);sCtx.stroke();sCtx.beginPath();sCtx.moveTo(s.x,s.y-s.r*2);sCtx.lineTo(s.x,s.y+s.r*2);sCtx.stroke();sCtx.fillStyle=`rgba(250,245,230,${a})`;sCtx.beginPath();sCtx.arc(s.x,s.y,s.r*.6,0,6.28);sCtx.fill()}
    else if(s.type==='glow'){const g=sCtx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*3);g.addColorStop(0,`rgba(${s.hue},${a})`);g.addColorStop(.3,`rgba(${s.hue},${a*.4})`);g.addColorStop(1,'transparent');sCtx.beginPath();sCtx.arc(s.x,s.y,s.r*3,0,6.28);sCtx.fillStyle=g;sCtx.fill()}
  }));
  requestAnimationFrame(drawStars);
}

// ===== FX CANVAS =====
let pCanvas,pCtx;
let particles=[];
function resizePC(){const d=dpr();pCanvas.width=innerWidth*d;pCanvas.height=innerHeight*d;pCanvas.style.width=innerWidth+'px';pCanvas.style.height=innerHeight+'px';pCtx.setTransform(d,0,0,d,0,0)}
function spawnP(x,y,n=18,c='212,166,60'){
  for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=Math.random()*1.8+.3;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-Math.random()*.8,r:Math.random()*2.2+.4,life:1,decay:Math.random()*.014+.005,c})}
}
function spawnBurst(x,y){spawnP(x,y,30,'212,166,60');spawnP(x,y,10,'255,220,150')}
function drawP(){
  pCtx.clearRect(0,0,innerWidth,innerHeight);
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.012;p.life-=p.decay;
    if(p.life<=0){particles.splice(i,1);continue}
    const r=p.r*p.life*1.8;
    const grad=pCtx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
    grad.addColorStop(0,`rgba(${p.c},${p.life*.6})`);
    grad.addColorStop(.5,`rgba(${p.c},${p.life*.2})`);
    grad.addColorStop(1,`rgba(${p.c},0)`);
    pCtx.beginPath();pCtx.arc(p.x,p.y,r,0,6.28);pCtx.fillStyle=grad;pCtx.fill();
  }
  requestAnimationFrame(drawP);
}

// ===== METEOR ANIMATION =====
async function animateMeteor(fadeSelector){
  return new Promise(resolve=>{
    // Fade text if selector provided
    if(fadeSelector){
      const els=document.querySelectorAll(fadeSelector);
      els.forEach(el=>{el.style.transition='opacity 1.5s ease';el.style.opacity='0'});
    }
    const w=innerWidth,h=innerHeight;let f=0;const total=200;
    function step(){
      if(f>=total){resolve();return}
      const t=f/total;
      const mx=w*.85-t*w*.35;
      const my=h*.05+t*h*.45+Math.sin(t*Math.PI*1.5)*(h*.02);
      // Main trail — bright golden
      if(f%2===0)spawnP(mx,my,3,'255,230,160');
      // Shimmer particles — scattered wider
      if(f%3===0)spawnP(mx+Math.random()*20-10,my+Math.random()*16-8,2,'212,166,60');
      // Blue-white twinkle
      if(f%5===0)spawnP(mx+Math.random()*12-6,my+Math.random()*12-6,1,'180,200,240');
      // Bright core
      if(f%4===0)spawnP(mx,my,2,'255,255,240');
      f++;requestAnimationFrame(step);
    }
    step();
  });
}

    // Wand rises and moves across the screen, sprinkling sparks
    ww.style.transition='transform 2.5s ease-in-out';
    ww.style.transform='translateY(-30px)';
    const w=innerWidth,h=innerHeight;
    let sparkFrame=0;const totalFrames=150;
    function sprinkle(){
      if(sparkFrame>=totalFrames){
        // Final flash
        const flash=document.createElement('div');flash.className='magic-flash';
        flash.style.setProperty('--mx',(w/2)+'px');flash.style.setProperty('--my',(h/2)+'px');
        document.body.appendChild(flash);
        setTimeout(()=>flash.remove(),2200);
        setTimeout(()=>{showScene('chinnodu');initChinnodu()},2000);
        return;
      }
      const t=sparkFrame/totalFrames;
      // Wand sweeps in an arc across the screen
      const sx=w*0.15+t*w*0.7;
      const sy=h*0.3+Math.sin(t*Math.PI)*(-h*0.15);
      if(sparkFrame%2===0)spawnP(sx,sy,3,'255,230,160');
      if(sparkFrame%3===0)spawnP(sx+Math.random()*30-15,sy+Math.random()*20,2,'212,166,60');
      if(sparkFrame%5===0)spawnP(sx+Math.random()*20-10,sy+Math.random()*30,1,'180,200,240');
      sparkFrame++;requestAnimationFrame(sprinkle);
    }
    sprinkle();
  },{once:true});
}

// ============================================================
// FIREWORKS
// ============================================================
function startFireworks(){
  const c=document.createElement('canvas');c.className='firework-canvas';
  document.body.appendChild(c);
  const ctx=c.getContext('2d');
  function resize(){c.width=innerWidth;c.height=innerHeight}
  resize();window.addEventListener('resize',resize);
  const palettes=[
    ['#ffd6e0','#ffb3c6','#ff8fab','#fff0f5'],
    ['#c8b6ff','#e0c3fc','#d4b8ff','#f0e6ff'],
    ['#bde0fe','#a2d2ff','#caf0f8','#e0f7ff'],
    ['#ffe8a0','#ffd670','#fff5d0','#fff9e6'],
    ['#ffffff','#f0f0f0','#e8e8e8','#fafafa']
  ];
  const sparks=[];
  function explode(x,y){
    const pal=palettes[Math.floor(Math.random()*palettes.length)];
    const n=30+Math.floor(Math.random()*20);
    const speed=.6+Math.random()*.8;
    for(let i=0;i<n;i++){
      const a=Math.PI*2*i/n+Math.random()*.15;
      const v=speed+Math.random()*1.2;
      const col=pal[Math.floor(Math.random()*pal.length)];
      sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,decay:.006+Math.random()*.008,col,r:.4+Math.random()*.6});
    }
  }
  let fwFrame=0;
  function drawFW(){
    ctx.clearRect(0,0,c.width,c.height);
    for(let i=sparks.length-1;i>=0;i--){
      const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vy+=.015;s.vx*=.995;s.life-=s.decay;
      if(s.life<=0){sparks.splice(i,1);continue}
      ctx.globalAlpha=s.life*.8;
      ctx.shadowBlur=4;ctx.shadowColor=s.col;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fillStyle=s.col;ctx.fill();
      // Thin line from center for that spiky look
      if(s.life>.5){
        ctx.globalAlpha=s.life*.3;
        ctx.beginPath();ctx.moveTo(s.x-s.vx*2,s.y-s.vy*2);ctx.lineTo(s.x,s.y);
        ctx.strokeStyle=s.col;ctx.lineWidth=.3;ctx.stroke();
      }
    }
    ctx.shadowBlur=0;ctx.globalAlpha=1;
    fwFrame++;
    if(fwFrame<4000)requestAnimationFrame(drawFW);
    else{c.remove()}
  }
  let launches=0;
  function wave(){
    if(launches>=80)return;
    const x=Math.random()*innerWidth*.7+innerWidth*.15;
    const y=Math.random()*innerHeight*.35+innerHeight*.05;
    explode(x,y);
    // Sometimes double burst nearby
    if(Math.random()>.6){
      setTimeout(()=>{
        explode(x+Math.random()*60-30,y+Math.random()*40-20);
      },200+Math.random()*300);
    }
    launches++;
    setTimeout(wave,800+Math.random()*1200);
  }
  wave();
  requestAnimationFrame(drawFW);
}

// ============================================================
// AUDIO — Local MP3
// ============================================================
let audioPlaying=false,bgmAudio=null;
const playlist=['bgm.mp3','song1.mp3','song2.mp3'];
let playlistIdx=0;

function playTrack(idx){
  playlistIdx=idx%playlist.length;
  if(bgmAudio){bgmAudio.pause();bgmAudio=null}
  bgmAudio=new Audio(playlist[playlistIdx]);
  bgmAudio.volume=1.0;
  bgmAudio.addEventListener('ended',function(){
    audioPlaying=false;
    playTrack(playlistIdx+1);
  });
  bgmAudio.load();
  var p=bgmAudio.play();
  if(p&&p.then)p.then(function(){
    audioPlaying=true;
  }).catch(function(e){console.warn('Audio play blocked:',e)});
}
function startBGM(){
  if(audioPlaying)return;
  playTrack(0);
}
function toggleAudio(){
  if(!bgmAudio){playTrack(0);return}
  if(audioPlaying){
    bgmAudio.pause();
    audioPlaying=false;
  }else{
    bgmAudio.play().then(function(){audioPlaying=true}).catch(function(){});
  }
}

function init(){
  // Audio: use capture phase to intercept ALL clicks before anything else
  document.addEventListener('click',startBGM,{capture:true,once:true});

  document.getElementById('audio-btn').addEventListener('click',toggleAudio);

  startPrologue();
}
